<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AMCN Store - Sistema de Apartados</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap');

        :root {
            --gold-primary: #e5cb87;
            --bg-dark: #0b0b0b;
            --panel-dark: #111111;
            --border-gold: rgba(229, 203, 135, 0.15);
            --tab-inactive: #666666;
            --color-pending: #ff4d4d;
            --color-settled: #2ecc71;
            --color-delivered: #3498db;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            padding-bottom: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        .view-section {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 15px;
            box-sizing: border-box;
            animation: fadeIn 0.2s ease-in-out;
        }

        .view-section.active-view {
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bottom-tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #121212;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: transparent;
            border: none;
            color: var(--tab-inactive);
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 500;
            gap: 4px;
            width: 33%;
            -webkit-tap-highlight-color: transparent;
        }

        .tab-item.active-tab {
            color: var(--gold-primary);
        }

        .tab-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .database-panel {
            background-color: #151515;
            border: 1px solid var(--border-gold);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-radius: 8px;
        }

        .db-title {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            color: var(--gold-primary);
            letter-spacing: 2px;
            margin: 0;
            text-transform: uppercase;
            text-align: center;
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .config-group label {
            font-size: 11px;
            color: #8c8c8c;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .config-input {
            background: #222222;
            border: 1px solid #444444;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            padding: 12px;
            font-size: 14px;
            border-radius: 6px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-panel {
            width: 100%;
            padding: 14px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            background-color: var(--gold-primary);
            color: #111111;
        }

        .cloud-status {
            font-size: 11px;
            color: #8c8c8c;
            margin: 0;
            text-align: center;
            line-height: 1.5;
        }

        .search-hero-container {
            background-color: #111111;
            border: 1px solid var(--border-gold);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-wrapper-block {
            position: relative;
            width: 100%;
        }

        .search-input-field {
            background: #222222;
            border: 1px solid #444444;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            padding: 14px 14px 14px 42px;
            font-size: 15px;
            border-radius: 6px;
            width: 100%;
            outline: none;
            box-sizing: border-box;
        }

        .lens-icon-vector {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--gold-primary);
        }

        .history-list-title {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: var(--gold-primary);
            letter-spacing: 1px;
            margin: 10px 0 5px 0;
            text-transform: uppercase;
        }

        .custom-cards-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .client-history-card {
            background-color: #161616;
            border: 1px solid rgba(255,255,255,0.04);
            padding: 14px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .client-card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-subtext {
            font-size: 11px;
            color: #8c8c8c;
        }

        .card-balance-tag {
            font-size: 13px;
            font-weight: 600;
            color: var(--gold-primary);
            background-color: rgba(229, 203, 135, 0.06);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid rgba(229, 203, 135, 0.1);
        }

        .status-badge {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .status-pending {
            background-color: rgba(255, 77, 77, 0.15);
            color: var(--color-pending);
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .status-settled {
            background-color: rgba(46, 204, 113, 0.15);
            color: var(--color-settled);
            border: 1px solid rgba(46, 204, 113, 0.2);
        }

        .status-delivered {
            background-color: rgba(52, 152, 219, 0.15);
            color: var(--color-delivered);
            border: 1px solid rgba(52, 152, 219, 0.2);
        }

        .start-creation-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px 50px 20px;
            background-color: var(--panel-dark);
            border: 1px dashed var(--gold-primary);
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            gap: 15px;
        }

        .start-creation-desc {
            font-size: 12px;

            margin: -5px 0 15px 0;
            text-align: center;
            max-width: 320px;
            line-height: 1.5;

        .btn-trigger-start {
            background-color: var(--gold-primary);

            padding: 16px 24px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 203, 135, 0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .ticket-wrapper-dynamic {
            display: none;
            width: 100%;
            flex-direction: column;
        }

        .ticket-container {
            background-color: #0b0b0b;
            box-shadow: 0 12px 40px rgba(212, 175, 55, 0.08);
            width: 100%;
            padding: 30px 20px;
            box-sizing: border-box;
            border: 1px solid rgba(229, 203, 135, 0.15);
            text-align: center;
            border-radius: 4px;
        }

        .brand-header {
            margin-bottom: 20px;
            width: 100%;
            text-align: center;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(32px, 7vw, 48px);
            letter-spacing: 4px;
            margin: 0;
            color: #e5cb87;
            line-height: 1.1;
        }

    <script>
        const issueDateInput = document.getElementById('issue-date');
        const clientInput = document.getElementById('client-name');
        const costInput = document.getElementById('total-cost');
        const paidInput = document.getElementById('total-paid');
        const remainingInput = document.getElementById('remaining-balance');
        const outputContainer = document.getElementById('output-container');
        const imageWrapper = document.getElementById('image-wrapper');
        const dueDateInput = document.getElementById('due-date');
        const itemNameInput = document.getElementById('item-name');
        const paymentMethodInput = document.getElementById('payment-method');
        const statusLabel = document.getElementById('db-status-label');
        const docStatusTitle = document.getElementById('doc-status-title');
        const startScreenPanel = document.getElementById('start-screen-panel');
        const dynamicTicketContainer = document.getElementById('dynamic-ticket-container');
        const mainSearchInput = document.getElementById('main-search-input');
        const cardsHistoryHolder = document.getElementById('cards-history-holder');
        const legalAndSocialsBlock = document.getElementById('legal-and-socials-block');
        const dueDateRow = document.getElementById('due-date-row');
        const balanceRow = document.getElementById('balance-row');
        const btnAddInstallment = document.getElementById('btn-add-installment');
        const btnDeliverProduct = document.getElementById('btn-deliver-product');

        let driveScriptUrl = '';
        let cloudClients = {};
        const LOCAL_STORAGE_KEY = 'amcn_store_history_tabs_v11';

        window.activateCleanForm = function() {
            issueDateInput.value = "05 de Noviembre, 2026";
            clientInput.value = "";
            itemNameInput.value = "";
            paymentMethodInput.value = "Efectivo / Transferencia";
            costInput.value = "$0.00 MXN";
            paidInput.value = "$0.00 MXN";
            remainingInput.value = "$0.00 MXN";
            dueDateInput.value = "";
            mainSearchInput.value = "";
            outputContainer.style.display = 'none';
            legalAndSocialsBlock.style.display = 'none';
            dueDateRow.style.display = 'flex';
            balanceRow.style.display = 'flex';
            docStatusTitle.textContent = "Nota de Apartado";
            startScreenPanel.style.display = 'none';
            dynamicTicketContainer.style.display = 'flex';
            document.querySelectorAll('.mode-create-only').forEach(el => el.style.display = 'block');
            document.querySelectorAll('.mode-history-only').forEach(el => el.style.display = 'none');
        };

        window.switchView = function(viewId, tabButton) {
            document.querySelectorAll('.view-section').forEach(view => view.classList.remove('active-view'));
            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active-tab'));
            document.getElementById(viewId).classList.add('active-view');
            tabButton.classList.add('active-tab');
            if (viewId === 'view-search-database') {
                rebuildHistoryCardsGrid(cloudClients);
            }
        };

        function cleanNumber(value) {
            if (!value) return 0;
            return parseFloat(value.toString().replace(/[^0-9.]/g, '')) || 0;
        }

        function formatMXN(number) {
            return '$' + number.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' MXN';
        }

        function updateBalance() {
            const balance = cleanNumber(costInput.value) - cleanNumber(paidInput.value);
            remainingInput.value = formatMXN(balance);
            adjustContextualActionButtons(balance, clientInput.value.trim());
        }

        function adjustContextualActionButtons(balance, name) {
            if (!name || !cloudClients[name]) return;
            const currentStatus = cloudClients[name].status || 'pending';
            
            if (currentStatus === 'delivered') {
                btnAddInstallment.style.display = 'none';
                btnDeliverProduct.style.display = 'none';
                dueDateRow.style.display = 'none';
                balanceRow.style.display = 'none';
                docStatusTitle.textContent = "Ticket de Liquidación y Entrega";
                return;
            }
            
            dueDateRow.style.display = 'flex';
            balanceRow.style.display = 'flex';
            
            if (balance <= 0) {
                btnAddInstallment.style.display = 'none';
                btnDeliverProduct.style.display = 'block';
                docStatusTitle.textContent = "Apartado Liquidado (Por Entregar)";
            } else {
                btnAddInstallment.style.display = 'block';
                btnDeliverProduct.style.display = 'none';
                docStatusTitle.textContent = "Nota de Apartado";
            }
        }

        costInput.addEventListener('input', updateBalance);
        paidInput.addEventListener('input', updateBalance);
        costInput.addEventListener('blur', () => costInput.value = formatMXN(cleanNumber(costInput.value)));
        paidInput.addEventListener('blur', () => paidInput.value = formatMXN(cleanNumber(paidInput.value)));

        function promptNewInstallment() {
            const clientName = clientInput.value.trim();
            if (!clientName) {
                alert("Ingresa primero el nombre del cliente.");
                return;
            }
            const rawInput = prompt(`Monto a abonar para ${clientName}:`, "0");
            if (rawInput === null) return;
            
            const newAmount = parseFloat(rawInput.replace(/[^0-9.]/g, '')) || 0;
            if (newAmount <= 0) {
                alert("Monto no válido.");
                return;
            }
            paidInput.value = formatMXN(cleanNumber(paidInput.value) + newAmount);
            updateBalance();
            saveCurrentToCloud(true);
        }

        window.markProductAsDelivered = function() {
            const name = clientInput.value.trim();
            if (!name || !cloudClients[name]) return;
            if (!confirm(`¿Confirmar la liquidación final y entrega física del producto a ${name}? Esto transformará permanentemente el recibo.`)) return;

            updateBalance();
            saveCurrentToCloud(true);
            alert("¡Nota archivada como Ticket de Liquidación y Entrega!");
            clearAmounts();
        };
